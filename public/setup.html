<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scale Ops — First-time setup</title>
<style>
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #F6F4EF; color: #1C2B39; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; padding: 32px 30px; border-radius: 14px; width: 360px; border: 1px solid #E4DFD3; }
  h1 { font-family: Georgia, serif; font-size: 20px; margin: 0 0 4px; }
  p { font-size: 13px; color: #4B5B67; margin: 0 0 20px; line-height: 1.5; }
  label { display: block; font-size: 12px; font-weight: 600; color: #4B5B67; margin-bottom: 5px; }
  input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid #E4DFD3; margin-bottom: 14px; font-size: 14px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #1C2B39; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .msg { font-size: 13px; margin-top: 14px; }
  .err { color: #9B2C2C; }
  .ok { color: #2F6844; }
</style>
</head>
<body>
<div class="card">
  <h1>First-time setup</h1>
  <p>Creates the very first login account. This only works once — if an account already exists, it will refuse. Use the "Setup secret" you set as an environment variable (<code>SETUP_SECRET</code>) in Netlify.</p>
  <form id="f">
    <label>Setup secret</label>
    <input type="password" id="secret" required />
    <label>Choose a username</label>
    <input id="username" required />
    <label>Choose a password (8+ characters)</label>
    <input type="password" id="password" required minlength="8" />
    <button type="submit">Create account</button>
  </form>
  <div id="msg" class="msg"></div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const secret = document.getElementById('secret').value;
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.textContent = 'Creating...'; msg.className = 'msg';
  try {
    const res = await fetch('/api/setup-admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret, username, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Setup failed');
    msg.textContent = 'Account created. You can now sign in on the main site.';
    msg.className = 'msg ok';
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg err';
  }
});
</script>
</body>
</html>
